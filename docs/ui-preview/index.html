<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyTrans Preview</title>
<style>
  :root {
    --bg: #ffffff;
    --desk: #e9e9ee;
    --primary: #000000;
    --secondary: rgba(60, 60, 67, 0.6);
    --tertiary: rgba(60, 60, 67, 0.3);
    --glass: rgba(255, 255, 255, 0.55);
    --glass-edge: rgba(255, 255, 255, 0.9);
    --glass-shadow: rgba(0, 0, 0, 0.12);
    --frame: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --desk: #1b1b1f;
      --primary: #ffffff;
      --secondary: rgba(235, 235, 245, 0.6);
      --tertiary: rgba(235, 235, 245, 0.3);
      --glass: rgba(60, 60, 67, 0.45);
      --glass-edge: rgba(255, 255, 255, 0.18);
      --glass-shadow: rgba(0, 0, 0, 0.5);
      --frame: #3a3a3c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --desk: #1b1b1f;
    --primary: #ffffff;
    --secondary: rgba(235, 235, 245, 0.6);
    --tertiary: rgba(235, 235, 245, 0.3);
    --glass: rgba(60, 60, 67, 0.45);
    --glass-edge: rgba(255, 255, 255, 0.18);
    --glass-shadow: rgba(0, 0, 0, 0.5);
    --frame: #3a3a3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px 16px;
    background: var(--desk);
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    color: var(--primary);
  }
  .phone {
    width: min(390px, 100%);
    aspect-ratio: 390 / 844;
    max-height: calc(100vh - 110px);
    border-radius: 54px;
    border: 12px solid var(--frame);
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
  }
  .island {
    position: absolute;
    top: 10px; left: 50%;
    width: 110px; height: 32px;
    transform: translateX(-50%);
    background: #000;
    border-radius: 20px;
    z-index: 2;
  }
  .pane {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
  }
  .pane::-webkit-scrollbar { display: none; }
  .pane.top { transform: rotate(180deg); padding-bottom: 50px; }
  .pane .spacer { flex: 1; }
  .line {
    font-size: 19px;
    line-height: 1.3;
    color: var(--secondary);
    transition: opacity .25s, color .25s, font-size .25s;
  }
  .line.newest { font-size: 27px; font-weight: 600; color: var(--primary); }
  .line.live { opacity: .6; }
  .hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; color: var(--tertiary);
  }
  .bar {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    padding: 10px 0;
    position: relative;
  }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: 0 6px 20px var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
    color: var(--primary);
    transition: transform .15s;
  }
  .glass:active { transform: scale(.94); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .circle {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
    padding: 0;
  }
  .capsule {
    height: 48px;
    border-radius: 24px;
    display: flex; align-items: center;
    padding: 0 12px;
    gap: 2px;
  }
  .capsule button {
    background: none; border: none;
    height: 48px; padding: 0 6px;
    font-size: 17px; font-weight: 500;
  }
  .capsule .swap { width: 32px; padding: 0; display: grid; place-items: center; }
  svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .wave rect { fill: currentColor; stroke: none; animation: wave 1s ease-in-out infinite; transform-origin: center; }
  .wave rect:nth-child(2) { animation-delay: .15s; }
  .wave rect:nth-child(3) { animation-delay: .3s; }
  .wave rect:nth-child(4) { animation-delay: .45s; }
  .wave rect:nth-child(5) { animation-delay: .6s; }
  .paused .wave rect { animation: none; opacity: .35; }
  @keyframes wave { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .menu {
    position: absolute;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 18px;
    padding: 6px;
    min-width: 200px;
    display: none;
    z-index: 5;
  }
  .menu.open { display: block; }
  .menu button {
    display: block; width: 100%;
    text-align: left;
    background: none; border: none;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 16px;
  }
  .menu button:hover { background: var(--glass-edge); }
  .menu button.selected::after { content: " ✓"; }
  .caption { font-size: 13px; color: var(--secondary); text-align: center; max-width: 390px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="island"></div>
    <div class="pane top" id="paneTop"></div>
    <div class="bar">
      <button class="glass circle" id="reset" title="Gespräch zurücksetzen">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <div class="glass capsule">
        <button id="langTop">Deutsch</button>
        <button class="swap" id="swap" title="Seiten tauschen">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M7 3v18M3 7l4-4 4 4M17 21V3M13 17l4 4 4-4"/></svg>
        </button>
        <button id="langBottom">Español</button>
      </div>
      <button class="glass circle" id="mic" title="Zuhören pausieren">
        <svg viewBox="0 0 24 24" class="wave">
          <rect x="2" y="9" width="2.4" height="6" rx="1.2"/>
          <rect x="6.6" y="5" width="2.4" height="14" rx="1.2"/>
          <rect x="11.2" y="2" width="2.4" height="20" rx="1.2"/>
          <rect x="15.8" y="6" width="2.4" height="12" rx="1.2"/>
          <rect x="20.4" y="9" width="2.4" height="6" rx="1.2"/>
        </svg>
      </button>
      <div class="glass menu" id="menu"></div>
    </div>
    <div class="pane bottom" id="paneBottom"></div>
  </div>
  <div class="caption">Vorschau mit simuliertem Gespräch. Obere Hälfte ist für dein Gegenüber (steht auf dem Kopf).</div>

<script src="app.js"></script>
</body>
</html>
